<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiteQuest-RAG — Academic Search + AI Overview</title>
<style>
  :root {
    --bg: #f8f9fa; --card: #fff; --border: #dee2e6;
    --text: #212529; --muted: #6c757d; --accent: #2563eb;
    --accent-hover: #1d4ed8; --warning: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px; }

  h1 { font-size: 1.5rem; margin-bottom: 20px; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 1rem; }

  /* --- search bar --- */
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-row input { flex: 1; padding: 12px 16px; font-size: 1rem;
    border: 2px solid var(--border); border-radius: 8px; outline: none;
    transition: border-color .2s; }
  .search-row input:focus { border-color: var(--accent); }
  .search-row button { padding: 12px 24px; font-size: 1rem; background: var(--accent);
    color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
  .search-row button:hover { background: var(--accent-hover); }
  .search-row button:disabled { opacity: .6; cursor: not-allowed; }

  /* --- controls --- */
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    margin-bottom: 20px; font-size: .9rem; }
  .modes { display: flex; gap: 4px; }
  .modes label { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; background: var(--card); transition: all .15s; }
  .modes input { display: none; }
  .modes input:checked + label { background: var(--accent); color: #fff; border-color: var(--accent); }
  .alpha-group { display: flex; align-items: center; gap: 6px; }
  .alpha-group input[type=range] { width: 100px; }
  .toggle-row { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }

  /* --- overview --- */
  .overview { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px;
    padding: 16px 20px; margin-bottom: 20px; }
  .overview h3 { font-size: .85rem; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  .overview .answer { font-size: .95rem; white-space: pre-wrap; margin-bottom: 12px; }
  .overview .citations { display: flex; gap: 8px; flex-wrap: wrap; }
  .overview .cite-card { background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; font-size: .8rem; max-width: 220px; }
  .overview .cite-card strong { display: block; margin-bottom: 2px; }
  .overview .cite-card .cite-url { color: var(--accent); font-size: .75rem; }
  .overview .warn { background: #fef3c7; color: #92400e; padding: 4px 10px; border-radius: 4px; font-size: .8rem; margin-top: 8px; display: inline-block; }

  /* --- results --- */
  .results-header { font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
  .result { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 10px; transition: box-shadow .15s; }
  .result:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .result .r-title { font-size: 1rem; font-weight: 600; margin-bottom: 2px; }
  .result .r-meta { font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  .result .r-snippet { font-size: .85rem; color: #495057; }
  .result .r-snippet mark { background: #fef08a; padding: 0 1px; border-radius: 2px; }
  .result .r-score { float: right; font-size: .8rem; color: var(--muted); }

  /* --- states --- */
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty p { font-size: .9rem; }

  @media (max-width: 600px) {
    .controls { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>CiteQuest-RAG <span>Academic Search + AI Overview</span></h1>

  <!-- search -->
  <div class="search-row">
    <input id="query" type="text" placeholder="输入关键词或问题，如: What are multimodal LLMs?" autofocus>
    <button id="searchBtn" onclick="doSearch()">搜索</button>
  </div>

  <!-- controls -->
  <div class="controls">
    <div class="modes" id="modes">
      <input type="radio" name="mode" value="hybrid" id="m-hybrid" checked onchange="onModeChange()">
      <label for="m-hybrid">Hybrid</label>
      <input type="radio" name="mode" value="lexical" id="m-lexical" onchange="onModeChange()">
      <label for="m-lexical">Lexical</label>
      <input type="radio" name="mode" value="vector" id="m-vector" onchange="onModeChange()">
      <label for="m-vector">Vector</label>
    </div>
    <div class="alpha-group" id="alphaGroup">
      <label>α:</label>
      <input type="range" id="alpha" min="0" max="1" step="0.05" value="0.5" oninput="document.getElementById('alphaVal').textContent=this.value">
      <span id="alphaVal">0.5</span>
    </div>
    <label class="toggle-row">
      <input type="checkbox" id="overviewToggle" checked onchange="onOverviewToggle()">
      AI Overview
    </label>
  </div>

  <!-- results area -->
  <div id="resultsArea"><div class="empty"><p>输入关键词开始搜索</p></div></div>
</div>

<script>
const API = '';

function getMode() {
  return document.querySelector('input[name=mode]:checked')?.value || 'hybrid';
}

function onModeChange() {
  const alphaGroup = document.getElementById('alphaGroup');
  alphaGroup.style.display = getMode() === 'hybrid' ? 'flex' : 'none';
}

function onOverviewToggle() {
  // Nothing needed — doSearch reads the checkbox
}

async function doSearch() {
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = '搜索中...';

  const area = document.getElementById('resultsArea');
  area.innerHTML = '<div class="loading">正在搜索...</div>';

  const mode = getMode();
  const alpha = parseFloat(document.getElementById('alpha').value);
  const includeOverview = document.getElementById('overviewToggle').checked;

  const start = performance.now();

  try {
    const resp = await fetch(`${API}/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: 10, mode, alpha, include_overview: includeOverview }),
    });
    const data = await resp.json();
    const elapsed = (performance.now() - start) / 1000;
    renderResults(data, elapsed);
  } catch (e) {
    area.innerHTML = `<div class="empty"><p>请求失败: ${e.message}</p></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '搜索';
  }
}

function renderResults(data, elapsed) {
  let html = '';

  // AI Overview
  if (data.ai_overview) {
    const ov = data.ai_overview;
    html += '<div class="overview">';
    html += `<h3>AI Overview · ${ov.latency_ms?.toFixed(0) || '?'}ms</h3>`;
    html += `<div class="answer">${escapeHtml(ov.answer)}</div>`;
    if (ov.citation_warnings?.length) {
      ov.citation_warnings.forEach(w => {
        html += `<span class="warn">⚠ ${escapeHtml(w)}</span> `;
      });
    }
    if (ov.citations?.length) {
      html += '<div class="citations">';
      ov.citations.forEach(c => {
        html += `<div class="cite-card">
          <strong>[${c.citation_id}] ${escapeHtml(c.title || '')}</strong>
          <span class="cite-url">${c.url ? `<a href="${c.url}" target="_blank">arXiv</a>` : ''}</span>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  }

  // Results
  html += `<div class="results-header">${data.total_results || 0} 条结果 · ${elapsed.toFixed(2)}s · mode=${data.mode}</div>`;

  if (data.results?.length) {
    data.results.forEach(r => {
      const snippet = (r.snippet || '').replace(/<mark>/g, '<mark>').replace(/<\/mark>/g, '</mark>');
      html += `<div class="result">
        <span class="r-score">${r.score?.toFixed(4)}</span>
        <div class="r-title">${escapeHtml(r.title)}</div>
        <div class="r-meta">${r.year || '?'} · ${r.venue || 'arXiv'} · ${(r.authors||[]).slice(0,3).join(', ')}</div>
        ${snippet ? `<div class="r-snippet">${snippet}</div>` : ''}
      </div>`;
    });
  } else {
    html += '<div class="empty"><p>无结果</p></div>';
  }

  document.getElementById('resultsArea').innerHTML = html;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Enter key to search
document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// Init
onModeChange();
</script>
</body>
</html>
