<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CiteQuest-RAG — Academic Search + AI Overview</title>

  <!-- Pico.css — semantic CSS foundation -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

  <!-- Custom styles -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Alpine.js — reactive components -->
  <script defer
          src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js">
  </script>

  <!-- App scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
</head>
<body>
  <div class="app-container"
       x-data="citequest"
       x-cloak>

    <!-- ==================================================================
         Header
         ================================================================== -->

    <header class="app-header">
      <h1>CiteQuest-RAG<span class="version"> Academic Search + AI Overview</span></h1>
    </header>

    <!-- ==================================================================
         Search bar
         ================================================================== -->

    <div class="search-row">
      <input type="search"
             x-model="query"
             @keydown.enter="doSearch"
             placeholder="输入关键词或问题，如: What are multimodal LLMs?"
             autofocus>
      <button @click="doSearch"
              :disabled="loading || !query.trim()">
        <span x-show="!loading">搜索</span>
        <span x-show="loading" aria-busy="true">搜索中...</span>
      </button>
    </div>

    <!-- ==================================================================
         Controls: mode switcher, alpha slider, AI Overview toggle
         ================================================================== -->

    <div class="controls">

      <!-- Mode switcher (pill-style radio group) -->
      <div class="mode-switcher">
        <input type="radio" name="mode" value="hybrid" id="m-hybrid"
               x-model="mode" @change="onModeChange">
        <label for="m-hybrid">Hybrid</label>

        <input type="radio" name="mode" value="lexical" id="m-lexical"
               x-model="mode" @change="onModeChange">
        <label for="m-lexical">Lexical</label>

        <input type="radio" name="mode" value="vector" id="m-vector"
               x-model="mode" @change="onModeChange">
        <label for="m-vector">Vector</label>
      </div>

      <!-- Alpha slider (only shown in hybrid mode) -->
      <div class="alpha-group"
           x-show="mode === 'hybrid'"
           x-transition>
        <label for="alpha-slider">&alpha;:</label>
        <input type="range" id="alpha-slider"
               x-model="alpha"
               min="0" max="1" step="0.05">
        <span x-text="Number(alpha).toFixed(2)">0.50</span>
      </div>

      <!-- AI Overview toggle -->
      <label class="toggle-row">
        <input type="checkbox" x-model="includeOverview">
        <span>AI Overview</span>
      </label>
    </div>

    <!-- ==================================================================
         AI Overview
         ================================================================== -->

    <section class="overview" x-show="overview" x-transition>
      <h3>
        AI Overview
        <small x-text="'· ' + formatLatency(overview?.latency_ms) + ' · ' + (overview?.model || '')"></small>
      </h3>
      <div class="answer" x-text="overview?.answer"></div>

      <!-- Citation warnings -->
      <template x-for="w in overview?.citation_warnings || []">
        <span class="warning-tag" x-text="'⚠ ' + w"></span>
      </template>

      <!-- Citation cards -->
      <div class="citations" x-show="overview?.citations?.length">
        <template x-for="c in overview?.citations || []">
          <div class="cite-card">
            <strong x-text="'[' + c.citation_id + '] ' + (c.title || '')"></strong>
            <span class="cite-url">
              <template x-if="c.url">
                <a :href="c.url" target="_blank" rel="noopener">arXiv</a>
              </template>
            </span>
          </div>
        </template>
      </div>
    </section>

    <!-- ==================================================================
         Results area
         ================================================================== -->

    <!-- Loading state -->
    <div class="loading-state" x-show="loading">
      <span class="spinner"></span> 正在搜索...
    </div>

    <!-- Error state -->
    <div class="empty-state" x-show="error && !loading">
      <p x-text="'请求失败: ' + error"></p>
    </div>

    <!-- Empty / initial state -->
    <div class="empty-state" x-show="!loading && !error && results.length === 0">
      <p>输入关键词开始搜索</p>
    </div>

    <!-- Results (shown when we have data) -->
    <template x-if="!loading && results.length > 0">
      <div>
        <div class="results-header"
             x-text="totalResults + ' 条结果 · ' + formatLatency(elapsed * 1000) + ' · mode=' + mode">
        </div>

        <template x-for="(r, idx) in results" :key="r.chunk_id || idx">
          <article class="result-card">

            <!-- Compare checkbox (hidden until compare feature is enabled) -->
            <input type="checkbox" class="compare-check"
                   x-model="selected"
                   :value="r.paper_id">

            <div class="result-body">
              <div class="r-title" x-text="r.title"></div>
              <div class="r-meta">
                <span x-text="(r.year || '?') + ' · ' + (r.venue || 'arXiv')"></span>
                <template x-if="r.authors?.length">
                  <span x-text="' · ' + r.authors.slice(0, 3).join(', ')"></span>
                </template>
              </div>
              <div class="r-snippet"
                   x-show="r.snippet"
                   x-html="r.snippet">
              </div>
            </div>

            <div class="r-score" x-text="r.score?.toFixed(4)"></div>
          </article>
        </template>
      </div>
    </template>

    <!-- ==================================================================
         Compare bar — floating bottom bar (hidden until compare feature)
         Currently: x-show always false. To enable, remove the `&& false`.
         ================================================================== -->

    <div class="compare-bar"
         x-show="selected.length >= 2 && false"
         x-transition>
      已选 <strong x-text="selected.length"></strong> 篇论文
      <button @click="comparing = true">
        对比选中论文
      </button>
      <button class="compare-cancel"
              @click="selected = []; comparing = false; comparisonResult = null">
        取消
      </button>
    </div>

    <!-- ==================================================================
         Compare result (hidden until compare feature is implemented)
         ================================================================== -->

    <section class="compare-result"
             x-show="comparisonResult"
             x-transition>
      <h3>📊 论文对比分析</h3>
      <!-- Table will be populated when compare endpoint exists -->
      <div x-html="comparisonResult"></div>
    </section>

  </div><!-- /.app-container -->

  <!-- ==================================================================
       Alpine.js component definition
       ================================================================== -->

  <script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("citequest", () => ({
      // ---- state ----
      query: "",
      mode: "hybrid",
      alpha: 0.5,
      includeOverview: true,
      loading: false,
      error: null,
      results: [],
      overview: null,
      totalResults: 0,
      elapsed: 0,

      // Future compare feature (not wired to backend yet)
      selected: [],
      comparing: false,
      comparisonResult: null,

      // ---- derived ----
      get showAlpha() {
        return this.mode === "hybrid";
      },

      // ---- methods ----
      onModeChange() {
        // Placeholder for future mode-specific behavior
      },

      async doSearch() {
        const q = this.query.trim();
        if (!q) return;

        this.loading = true;
        this.error = null;
        this.results = [];
        this.overview = null;
        this.totalResults = 0;
        this.elapsed = 0;
        // Don't clear selected[] so the user can accumulate
        // comparisons across searches if they want

        const start = performance.now();

        try {
          const data = await searchPapers({
            query: q,
            mode: this.mode,
            alpha: Number(this.alpha),
            include_overview: this.includeOverview,
            top_k: 10,
          });

          this.elapsed = (performance.now() - start) / 1000;
          this.results = data.results || [];
          this.totalResults = data.total_results || this.results.length;
          this.overview = data.ai_overview || null;
        } catch (e) {
          this.elapsed = (performance.now() - start) / 1000;
          this.error = e.message;
        } finally {
          this.loading = false;
        }
      },
    }));
  });
  </script>
</body>
</html>
